events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  # Логирование
  access_log off;
  error_log /var/log/nginx/error.log warn;
  
  # Производительность
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  
  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    
    # Отключаем динамическое сжатие
    brotli off;
    gzip off;
    
    # Включаем статическое сжатие
    brotli_static on;
    gzip_static on;
    
    # Базовые заголовки безопасности
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA маршрутизация
    location / {
      try_files $uri $uri/ /index.html;
    }
    
    # Статические ресурсы с длительным кешированием
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header Vary "Accept-Encoding";
    }
    
    # Короткое кеширование для HTML
    location ~* \.html$ {
      expires 1h;
      add_header Cache-Control "public, must-revalidate";
    }

    # API и данные без кеширования
    location ~* \.(json|xml|yml|yaml)$ {
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
    }
    
    # Скрываем версию nginx
    server_tokens off;
  }
}