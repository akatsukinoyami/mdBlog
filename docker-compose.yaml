services:
  app:
    hostname: mdblog
    container_name: mdblog
    build: .
    env_file: .env.docker.local
    ports:
      - 5173:3000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    hostname: mdblog-db
    container_name: mdblog-db
    volumes:
      - ./postgres:/var/lib/postgresql/data
    env_file: .env.docker.local
    ports:
      - 5432:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
      interval: 5s
      timeout: 5s
      retries: 5
